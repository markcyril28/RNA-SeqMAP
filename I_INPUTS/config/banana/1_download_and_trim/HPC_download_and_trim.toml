# ==============================================================================
# DOWNLOAD & TRIM CONFIG — BANANA (Musa acuminata) — Full SRR List
# ==============================================================================
# TEMPLATE — see I_INPUTS/config/banana/README.md for the fill-in checklist.
#
# Purpose: Download and quality-trim all RNA-seq SRR files before alignment.
# Run this config BEFORE any alignment config (2_alignment/).
#
# Two download options (enable only one):
#   Option A — Keep raw files:  enable DOWNLOAD_SRR + TRIM_SRR
#   Option B — Auto-cleanup:    enable DOWNLOAD_TRIM_and_DELETE_RAW_SRR
# ==============================================================================

# Runtime
threads = 12
jobs = 1
optimal_threads_per_job = 12
use_gnu_parallel = true
keep_bam_global = "n"

# Pipeline Stages
pipeline_stages = [
    #"MAMBA_INSTALLATION",

    # Option A: Separate download and trim (keeps raw files)
    #"DOWNLOAD_SRR",
    #"TRIM_SRR",

    # Option B: Combined download+trim+cleanup (auto-deletes raw after trim)
    "DOWNLOAD_TRIM_and_DELETE_RAW_SRR",

    "GZIP_TRIMMED_FILES",
    "QUALITY_CONTROL",

    #"DELETE_RAW_SRR",
    #"DELETE_TRIMMED_FASTQ_FILES",
]

# Input
# NOTE: FASTA is not used by the download/trim stages.
# A single placeholder entry is required for the pipeline loop to execute.
# TODO: point at the banana transcript FASTA once it is staged.
all_fasta_files = [
    "I_INPUTS/inputs/banana/2_alignment_input/reference_genome/Musa_acuminata_DH_Pahang_v4_transcripts.fa",
]

# SRR dataset file
# NOTE: a *relative* value is resolved under I_INPUTS/config/eggplant/shared/,
#       so banana files must be reached with the "../../banana/shared/" hop.
#       Available: srr_datasets.toml (full), srr_datasets_download.toml (subset),
#                  srr_datasets_TEST.toml (3-run smoke test).
srr_datasets = "../../banana/shared/srr_datasets_download.toml"

# Output
post_processing_root = "II_RESULTS/3_POST_PROC"

# Cleanup
activate_rm = false
