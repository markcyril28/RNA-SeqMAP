# Runtime
threads = 64
jobs = 2
use_gnu_parallel = true
keep_bam_global = "n"

# Pipeline Stages
pipeline_stages = [
    #"MAMBA_INSTALLATION",
    #"DOWNLOAD_SRR",
    #"TRIM_SRR",
    #"DOWNLOAD_TRIM_and_DELETE_RAW_SRR",
    #"GZIP_TRIMMED_FILES",
    #"QUALITY_CONTROL",
    #"DELETE_RAW_SRR",
    #"DELETE_TRIMMED_FASTQ_FILES",
    #"METHOD_1_HISAT2_REF_GUIDED",
    "METHOD_2_HISAT2_DE_NOVO",
    #"METHOD_3_STAR_ALIGNMENT",
    "METHOD_4_SALMON_SAF",
    "METHOD_5_BOWTIE2_RSEM",
]

# Input
# Genome FASTA used as the decoy for Salmon selective alignment (M4).
decoy = "I_INPUTS/inputs/banana/2_alignment_input/reference_genome/Musa_acuminata_DH_Pahang_v4_genome.fa"

# FASTA Files for Analysis (transcripts, required for M2, M4, M5)
all_fasta_files = [
    "I_INPUTS/inputs/banana/2_alignment_input/reference_genome/Musa_acuminata_DH_Pahang_v4_transcripts.fa",
    #"I_INPUTS/inputs/banana/2_alignment_input/reference_genome/Musa_TODO_v2_transcripts.fa",
]

# SRR dataset file
# REQUIRED for banana: omitting this key falls back to the default basename
# "srr_datasets.toml", which resolves under I_INPUTS/config/eggplant/shared/ and
# would silently run banana references against the EGGPLANT sample list.
srr_datasets = "../../banana/shared/srr_datasets.toml"

# Output
post_processing_root = "II_RESULTS/3_POST_PROC"

# Cleanup
activate_rm = false
