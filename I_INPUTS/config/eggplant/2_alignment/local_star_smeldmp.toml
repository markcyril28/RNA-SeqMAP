# ==============================================================================
# LOCAL CONFIG: STAR-ONLY (M3) for SmelDMP gene expression
# ==============================================================================
# Generated for Eggplant_Pipeline/03_gea.sh — focused STAR alignment for
# quantifying SmelDMP family expression on GPE001970 (v5) and Eggplant_V4.1.
# ==============================================================================

# Runtime
threads = 12
jobs = 2
use_gnu_parallel = true
keep_bam_global = "n"
star_read_length = 89        # PRJNA328564 reads are 89 bp
hisat2_strandness = ""

# Pipeline Stages — STAR only
pipeline_stages = [
    #"MAMBA_INSTALLATION",
    #"DOWNLOAD_SRR",
    #"TRIM_SRR",
    #"DOWNLOAD_TRIM_and_DELETE_RAW_SRR",
    #"GZIP_TRIMMED_FILES",
    #"QUALITY_CONTROL",
    #"DELETE_RAW_SRR",
    #"DELETE_TRIMMED_FASTQ_FILES",
    #"METHOD_1_HISAT2_REF_GUIDED",
    #"METHOD_2_HISAT2_DE_NOVO",
    "METHOD_3_STAR_ALIGNMENT",
    #"METHOD_4_SALMON_SAF",
    #"METHOD_5_BOWTIE2_RSEM",
]

# Genome / annotation pairs — both eggplant assemblies
# Format: "GTF|FASTA|STAR_TRANSCRIPTOME_FASTA"
genome_ref_pairs = [
    "I_INPUTS/inputs/eggplant/2_alignment_input/reference/GPE001970_genome.gtf|I_INPUTS/inputs/eggplant/2_alignment_input/reference_genome/GPE001970.fa|I_INPUTS/inputs/eggplant/2_alignment_input/reference_genome/GPE001970_transcripts.fa",
    "I_INPUTS/inputs/eggplant/2_alignment_input/reference/Eggplant_V4.1_function_IPR_final_stringtie.gtf|I_INPUTS/inputs/eggplant/2_alignment_input/reference_genome/Eggplant_V4.1.fa|I_INPUTS/inputs/eggplant/2_alignment_input/reference_genome/Eggplant_V4.1_transcripts.function.fa",
]

# Output
post_processing_root = "II_RESULTS/3_POST_PROC"

# Cleanup
activate_rm = false
