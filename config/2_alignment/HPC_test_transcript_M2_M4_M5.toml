# ==============================================================================
# TEST CONFIG: TRANSCRIPT-BASED METHODS (M2, M4, M5) — 3 SRRs
# ==============================================================================
# Methods tested:
#   M2 — HISAT2 De Novo (transcript FASTA)
#   M4 — Salmon SAF Quantification (transcript FASTA + genome decoy)
#   M5 — Bowtie2 + RSEM (transcript FASTA)
#
# Part 2 of 2 for full M1-M5 test run.
# Pair with HPC_test_genome_M1_M3.toml (M1, M3).
# ==============================================================================

# Runtime
threads = 64
jobs = 2
use_gnu_parallel = true
keep_bam_global = "n"

# Pipeline Stages
pipeline_stages = [
    #"MAMBA_INSTALLATION",
    #"DOWNLOAD_SRR",
    #"TRIM_SRR",
    #"DOWNLOAD_TRIM_and_DELETE_RAW_SRR",
    #"GZIP_TRIMMED_FILES",
    #"QUALITY_CONTROL",
    #"DELETE_RAW_SRR",
    #"DELETE_TRIMMED_FASTQ_FILES",
    #"METHOD_1_HISAT2_REF_GUIDED",
    "METHOD_2_HISAT2_DE_NOVO",
    #"METHOD_3_STAR_ALIGNMENT",
    "METHOD_4_SALMON_SAF",
    "METHOD_5_BOWTIE2_RSEM",
]

# Input
# Genome file used as decoy for Salmon SAF (M4)
decoy = "inputs/2_alignment_input/experimental/TEST.fasta"

# FASTA Files for Analysis (transcripts, required for M2, M4, M5)
all_fasta_files = [
    "inputs/2_alignment_input/reference_genome/GPE001970_transcripts.fa",
    "inputs/2_alignment_input/reference_genome/Eggplant_V4.1_transcripts.function.fa",
]

# SRR Test
# 3 samples for testing
# Source: https://www.ncbi.nlm.nih.gov/Traces/study/?acc=PRJNA328564&o=acc_s%3Aa
srr_combined_list = [
    "SRR3884686",   # Buds_0.7cm (flower bud initiation)
    "SRR3884687",   # Opened_Buds (flower development)
    "SRR3884597",   # Flowers (anthesis)
]

# Output
post_processing_root = "3_POST_PROC"

# Cleanup
activate_rm = false
